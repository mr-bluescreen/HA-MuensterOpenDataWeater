# Custom-integration audit against the current Home Assistant IQS rule families.
# "done" means implemented here; "exempt" includes a reason. Formal tier assignment
# remains a Home Assistant Core review decision.
#
# Test harness caveat (see docs/research.md, "20 September 2026" section): this
# repository's outbound network policy blocks both the upstream Münster API and
# developers.home-assistant.io, and its PyPI mirror caps at homeassistant==2024.3.3.
# All "done" test-related rules below were verified against that pinned core via
# pytest-homeassistant-custom-component, with small guarded compatibility shims
# (see coordinator.py, config_flow.py, __init__.py) so the same source runs on
# both that core and the newer Generic-ConfigEntry / config_entry-aware-coordinator
# APIs assumed elsewhere in this file. Re-verify against a current core before release.
rules:
  # Bronze
  action-setup: exempt  # No actions/services.
  appropriate-polling: done
  brands: exempt  # Core repository brands metadata is unavailable to custom integrations.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: done  # Runs on pytest-homeassistant-custom-component (real ConfigFlow/OptionsFlow harness).
  config-flow-test-before-setup: done
  dependency-transparency: done
  docs-actions: exempt
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  manifest: done
  runtime-data: done
  test-before-configure: done
  unique-config-entry: done

  # Silver
  action-exceptions: exempt
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done  # codeowners in manifest.json.
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: exempt  # Public API has no authentication.
  test-coverage: done  # 97% line coverage on custom_components/muenster_weather via pytest-homeassistant-custom-component.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: exempt  # No discovery mechanism.
  docs-data-privacy: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-supported-regions: done
  docs-troubleshooting: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: exempt  # No custom state icons are needed.
  reconfiguration-flow: done  # Estimate settings use an options flow and reload listener.
  repair-issues: done
  stale-devices: done  # A removed selected station creates a persistent repair issue.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
