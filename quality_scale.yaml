# Custom-integration audit against the current Home Assistant IQS rule families.
# "done" means implemented here; "exempt" includes a reason. Formal tier assignment
# remains a Home Assistant Core review decision.
rules:
  # Bronze
  action-setup: exempt  # No actions/services.
  appropriate-polling: done
  brands: exempt  # Core repository brands metadata is unavailable to custom integrations.
  common-modules: done
  config-flow: done
  config-flow-test-coverage: todo  # Requires the Home Assistant Core test harness.
  config-flow-test-before-setup: done
  dependency-transparency: done
  docs-actions: exempt
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  manifest: done
  runtime-data: done
  test-before-configure: done
  unique-config-entry: done

  # Silver
  action-exceptions: exempt
  config-entry-unloading: done
  docs-configuration-parameters: done
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: todo  # No codeowner has been nominated.
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: exempt  # Public API has no authentication.
  test-coverage: todo  # Pure domain layer is tested; HA harness tests remain outstanding.

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info: exempt  # No discovery mechanism.
  docs-data-privacy: done
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices: done
  docs-supported-functions: done
  docs-supported-regions: done
  docs-troubleshooting: done
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: exempt  # No custom state icons are needed.
  reconfiguration-flow: done  # Estimate settings use an options flow and reload listener.
  repair-issues: done
  stale-devices: done  # A removed selected station creates a persistent repair issue.

  # Platinum
  async-dependency: done
  inject-websession: done
  strict-typing: done
